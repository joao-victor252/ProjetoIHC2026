<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilização/Login.css">
    <title>PDV SYSTEM| Login</title>
</head>
<body>
    <div class="cadastro-container">
        <h1 class="login">Login</h1>

        <form action="#" method="get">
        
        <label for="nome">CPF: <span>*</span></label>
        <input type="text" name="cpf" id="cpf" placeholder="Digite apenas números:" required>

        <label for="senha">Senha: <span>*</span></label>
        <input type="password" name="senha" id="senha" required minlength="8" placeholder="Digite sua senha:">
        
        <input type="submit" value="Entrar" class="log-btn">

        </form>
         
        <footer>
            Problemas ao acessar? Contate o gerente.
        </footer>
    </div>
</body>
</html>
